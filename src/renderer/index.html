<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Bodega</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="lateral">
    <div class="marca">
      <strong id="marca-nombre">Bodega</strong>
      <span>stock y ventas</span>
    </div>
    <nav id="tabs">
      <button data-tab="caja" class="activo">Caja</button>
      <button data-tab="productos">Productos</button>
      <button data-tab="stock">Stock</button>
      <button data-tab="proveedores">Proveedores</button>
      <button data-tab="clientes">Clientes</button>
      <button data-tab="reportes">Reportes</button>
      <button data-tab="cierre">Cierre de caja</button>
      <button data-tab="ajustes">Ajustes</button>
    </nav>
    <div class="pie" id="pie"></div>
  </aside>

  <main>
    <section class="vista activa" id="vista-caja">
      <header class="barra">
        <h1>Caja</h1>
        <div class="buscador">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
          <input id="buscar" type="search" placeholder="Buscar producto o escanear código" autocomplete="off" spellcheck="false">
        </div>
        <select id="cliente" title="Cliente de la venta" aria-label="Cliente de la venta"></select>
      </header>

      <div class="dos">
        <div id="grilla" class="grilla"></div>

        <aside class="ticket">
          <div class="fila-titulo">
            <h2>Venta</h2>
            <div class="fila-titulo-acciones">
              <button id="btn-esperas" class="secundario chico" hidden>En espera</button>
              <button id="limpiar" class="secundario chico" disabled>Limpiar</button>
            </div>
          </div>

          <div id="carrito" class="carrito"></div>

          <div class="resumen">
            <div class="desc">
              <label for="descuento">Descuento</label>
              <div class="moneda"><span>$</span><input id="descuento" type="number" min="0" step="100" value="0" inputmode="numeric"></div>
            </div>
            <div class="total-fila" id="subtotal-fila" hidden>
              <span>Subtotal</span><span id="subtotal">$0</span>
            </div>
            <div class="total-fila descuento" id="descuento-fila" hidden>
              <span>Descuento</span><span id="descuento-monto">$0</span>
            </div>
            <div class="total"><span>Total</span><strong id="total">$0</strong></div>
          </div>

          <select id="medio" aria-label="Medio de pago">
            <option>Efectivo</option>
            <option>Débito</option>
            <option>Crédito</option>
            <option>Transferencia</option>
            <option>QR</option>
          </select>

          <div class="fila-botones">
            <button id="esperar" class="secundario">Dejar en espera</button>
            <button id="cobrar" class="primario">Cobrar</button>
          </div>
        </aside>
      </div>

      <div class="atajos">
        <span><kbd>F1</kbd> buscar</span>
        <span><kbd>F2</kbd> cobrar</span>
        <span><kbd>F3</kbd> dejar en espera</span>
        <span><kbd>F4</kbd> ventas en espera</span>
        <span><kbd>Esc</kbd> limpiar</span>
      </div>
    </section>

    <section class="vista" id="vista-productos">
      <header class="barra">
        <h1>Productos</h1>
        <div class="acciones">
          <input id="buscar-producto" type="search" placeholder="Filtrar por nombre, código o categoría" autocomplete="off">
          <button id="nuevo-producto" class="primario">Nuevo producto</button>
        </div>
      </header>
      <div id="tabla-productos" class="panel"></div>
    </section>

    <section class="vista" id="vista-stock">
      <header class="barra">
        <h1>Stock</h1>
        <span class="pista">Verde: OK · Ámbar: en el mínimo · Rojo: sin stock</span>
      </header>
      <div id="tabla-stock" class="panel"></div>
    </section>

    <section class="vista" id="vista-proveedores">
      <header class="barra">
        <h1>Proveedores</h1>
        <button id="nuevo-proveedor" class="primario">Nuevo proveedor</button>
      </header>
      <div class="dos">
        <div id="lista-proveedores" class="panel"></div>
        <div id="compras" class="panel"></div>
      </div>
    </section>

    <section class="vista" id="vista-clientes">
      <header class="barra">
        <h1>Clientes</h1>
        <button id="nuevo-cliente" class="primario">Nuevo cliente</button>
      </header>
      <div id="tabla-clientes" class="panel"></div>
    </section>

    <section class="vista" id="vista-reportes">
      <header class="barra">
        <h1>Reportes</h1>
        <div class="acciones" id="rangos">
          <button data-rango="hoy">Hoy</button>
          <button data-rango="semana" class="activo">7 días</button>
          <button data-rango="mes">30 días</button>
        </div>
      </header>
      <div id="reporte" class="panel"></div>
    </section>

    <section class="vista" id="vista-cierre">
      <header class="barra">
        <h1>Cierre de caja</h1>
        <span class="pista" id="cierre-fecha"></span>
      </header>
      <div id="cierre" class="panel"></div>
    </section>

    <section class="vista" id="vista-ajustes">
      <header class="barra">
        <h1>Ajustes</h1>
      </header>
      <div id="ajustes" class="panel"></div>
    </section>
  </main>

  <dialog id="modal">
    <form method="dialog" id="form-modal"></form>
  </dialog>
  <div id="aviso" class="aviso"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
