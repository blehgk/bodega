<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
  .icono {
    width: 512px; height: 512px; border-radius: 116px; position: relative;
    background: radial-gradient(120% 120% at 20% 0%, #1b2b33 0%, #0d1014 62%);
    box-shadow: inset 0 0 0 7px rgba(52, 211, 153, 0.16);
    display: flex; align-items: center; justify-content: center;
  }
  .marca {
    font: 800 300px/1 "DejaVu Sans", system-ui, sans-serif;
    color: #eef3f8; letter-spacing: -6px; transform: translateX(-8px);
  }
  .marca span { color: #34d399; }
</style>
</head>
<body>
  <div class="icono"><div class="marca">B<span>.</span></div></div>
</body>
</html>
