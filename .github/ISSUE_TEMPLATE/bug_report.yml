name: Reportar un bug
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Cuanto más concreto, más rápido se arregla.

  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Cuenta el hecho, sin interpretarlo.
      placeholder: Al cobrar con descuento, el total quedó en $0.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas
      placeholder: El total debía ser $5.100.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir Caja
        2. Agregar Coca-Cola 1.5L dos veces
        3. Poner $500 de descuento
        4. Cobrar
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Bodega
      description: Aparece en Ajustes, al pie.
      placeholder: 0.3.0
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operativo
      options:
        - Windows 10
        - Windows 11
        - Linux
        - Otro
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Algo más
      description: Capturas, el archivo de datos (sin datos personales) o el mensaje de error.
    validations:
      required: false
